name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests and smoke run (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev

      - name: Lint
        run: ruff check && ruff format --check

      - name: Test
        run: python -m pytest -q

      - name: Smoke run
        run: |
          python tests/fixture.py "$RUNNER_TEMP/smoke"
          privret run --data "$RUNNER_TEMP/smoke" --out "$RUNNER_TEMP/smoke/out" --top-k 5 --max-queries 2 --threads 3
